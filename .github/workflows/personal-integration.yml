name: Personal Integration

on:
  push:
    branches: [integration/stabey]
  workflow_dispatch:

concurrency:
  group: personal-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  checks:
    if: github.repository == 'stabey/paseo'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  desktop:
    if: github.repository == 'stabey/paseo'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set matching personal package versions
        run: |
          base_version="$(node -p "require('./package.json').version.split('-')[0]")"
          echo "PASEO_WEB_RELEASE_VERSION=${base_version}" >> "$GITHUB_ENV"
          version="${base_version}-stabey.${GITHUB_RUN_NUMBER}"
          npm version "$version" --no-git-tag-version --ignore-scripts
          node scripts/sync-workspace-versions.mjs --lockfile

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build personal macOS arm64 desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm run build:desktop -- --publish never --mac --arm64 \
            --config electron-builder.personal.yml

      - name: Verify personal signing entitlements
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, subprocess
          app = pathlib.Path("packages/desktop/release/mac-arm64/Paseo.app")
          subprocess.run(["codesign", "--verify", "--deep", "--strict", str(app)], check=True)
          bundles = [app, *sorted((app / "Contents/Frameworks").glob("*.app"))]
          for bundle in bundles:
              result = subprocess.run(["codesign", "-d", "--entitlements", ":-", str(bundle)], check=True, capture_output=True)
              entitlements = plistlib.loads(result.stdout)
              assert entitlements.get("com.apple.security.cs.disable-library-validation") is True, bundle
              signature = subprocess.run(["codesign", "-dv", str(bundle)], check=True, capture_output=True, text=True)
              assert "runtime" in signature.stderr, bundle
              print(f"Personal signing verified: {bundle.name}")
          PY

      - name: Record desktop build provenance
        run: |
          node -e 'require("node:fs").writeFileSync("packages/desktop/release/build-info.json", JSON.stringify({repository:process.env.GITHUB_REPOSITORY, branch:process.env.GITHUB_REF_NAME, commit:process.env.GITHUB_SHA, run:process.env.GITHUB_RUN_ID, version:require("./package.json").version}, null, 2)+"\n")'
          cd packages/desktop/release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: paseo-desktop-macos-arm64-${{ github.sha }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/build-info.json
            packages/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload packaged smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: personal-desktop-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

  daemon:
    if: github.repository == 'stabey/paseo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set matching personal package versions
        run: |
          base_version="$(node -p "require('./package.json').version.split('-')[0]")"
          echo "PASEO_WEB_RELEASE_VERSION=${base_version}" >> "$GITHUB_ENV"
          version="${base_version}-stabey.${GITHUB_RUN_NUMBER}"
          npm version "$version" --no-git-tag-version --ignore-scripts
          node scripts/sync-workspace-versions.mjs --lockfile

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build daemon, CLI, and bundled web UI
        run: |
          npm run build:server
          npm run build:daemon-web-ui

      - name: Pack all local daemon dependencies
        run: |
          mkdir -p artifacts/daemon
          for package in highlight relay protocol client plugin server cli; do
            npm pack --ignore-scripts --workspace="@getpaseo/${package}" --pack-destination artifacts/daemon
          done
          node -e 'require("node:fs").writeFileSync("artifacts/daemon/build-info.json", JSON.stringify({repository:process.env.GITHUB_REPOSITORY, branch:process.env.GITHUB_REF_NAME, commit:process.env.GITHUB_SHA, run:process.env.GITHUB_RUN_ID, version:require("./package.json").version}, null, 2)+"\n")'
          cd artifacts/daemon
          sha256sum ./*.tgz > SHA256SUMS

      - name: Verify installation from local packages
        run: |
          npm install --prefix "$RUNNER_TEMP/paseo-personal-install" ./artifacts/daemon/*.tgz
          "$RUNNER_TEMP/paseo-personal-install/node_modules/.bin/paseo" --version
          test -f "$RUNNER_TEMP/paseo-personal-install/node_modules/@getpaseo/server/dist/server/web-ui/index.html"
          node --input-type=module -e 'const p = process.env.RUNNER_TEMP + "/paseo-personal-install/node_modules/@getpaseo/server/dist/server/tunnel/tcp-stream.js"; const { TcpTunnelStream } = await import(p); if (typeof TcpTunnelStream !== "function") throw new Error("Missing personal tunnel implementation");'

      - name: Upload daemon packages
        uses: actions/upload-artifact@v4
        with:
          name: paseo-daemon-${{ github.sha }}
          path: artifacts/daemon/
          if-no-files-found: error
          retention-days: 30
